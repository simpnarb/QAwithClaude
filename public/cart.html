<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — ShopSimple</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav>
    <a class="nav-brand" href="/index.html">ShopSimple</a>
    <div class="nav-links" id="nav-links" data-testid="nav-links"></div>
  </nav>

  <main>
    <div class="section-title">Your Cart</div>

    <div id="cart-content" data-testid="cart-content">
      <div style="color:var(--muted);font-size:.9rem">Loading cart...</div>
    </div>
  </main>

  <!-- Checkout Modal -->
  <div class="modal-overlay hidden" id="checkout-modal" data-testid="checkout-modal">
    <div class="modal">
      <h3>Shipping Details</h3>
      <div id="checkout-error" data-testid="checkout-error" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="ship-name" data-testid="ship-name" placeholder="Jane Doe" />
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="ship-address" data-testid="ship-address" placeholder="123 Main St, City, State, ZIP"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeCheckout()">Cancel</button>
        <button class="btn btn-primary" id="place-order-btn" data-testid="place-order-btn" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <div id="toast-container" data-testid="toast-container" class="toast-container"></div>

  <script src="/js/app.js"></script>
  <script>
    let cartData = [];

    async function init() {
      const user = await apiFetch('/api/auth/me').catch(() => null);
      if (!user) { window.location.href = '/login.html'; return; }
      await loadNav();
      await renderCart();
    }

    async function renderCart() {
      cartData = await apiFetch('/api/cart').catch(() => []);
      const container = document.getElementById('cart-content');

      if (!cartData.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🛒</div>
            <h3>Your cart is empty</h3>
            <p>Browse our products and add something you like.</p>
            <a href="/index.html" class="btn btn-primary">Browse Products</a>
          </div>`;
        return;
      }

      const subtotal = cartData.reduce((s, i) => s + i.price * i.quantity, 0);
      const shipping = subtotal > 50 ? 0 : 5.99;
      const total = subtotal + shipping;

      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items" id="cart-items" data-testid="cart-items">
            ${cartData.map(item => `
              <div class="cart-item" id="item-${item.id}" data-testid="item-${item.id}">
                <div class="cart-item-emoji">${item.image}</div>
                <div class="cart-item-info">
                  <div class="cart-item-name">${item.name}</div>
                  <div class="cart-item-price">$${item.price.toFixed(2)} each</div>
                </div>
                <div class="qty-control">
                  <button onclick="changeQty('${item.id}', ${item.quantity - 1})">−</button>
                  <span class="qty-value">${item.quantity}</span>
                  <button onclick="changeQty('${item.id}', ${item.quantity + 1})">+</button>
                </div>
                <div class="cart-item-subtotal">$${(item.price * item.quantity).toFixed(2)}</div>
                <button class="btn btn-danger btn-sm" onclick="removeItem('${item.id}')">✕</button>
              </div>
            `).join('')}
          </div>

          <div class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-line"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
            <div class="summary-line"><span>Shipping</span><span>${shipping === 0 ? 'Free' : '$' + shipping.toFixed(2)}</span></div>
            ${shipping > 0 ? `<div style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem">Free shipping on orders over $50</div>` : ''}
            <div class="summary-line total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
            <button class="btn btn-primary form-full" style="margin-top:1rem" onclick="openCheckout()">Checkout</button>
          </div>
        </div>`;
    }

    async function changeQty(productId, qty) {
      try {
        await apiFetch(`/api/cart/${productId}`, { method: 'PUT', body: { quantity: qty } });
        await renderCart();
        await updateCartCount();
      } catch (e) { toast(e.message); }
    }

    async function removeItem(productId) {
      try {
        await apiFetch(`/api/cart/${productId}`, { method: 'DELETE' });
        await renderCart();
        await updateCartCount();
        toast('Item removed');
      } catch (e) { toast(e.message); }
    }

    function openCheckout() {
      document.getElementById('checkout-modal').classList.remove('hidden');
    }
    function closeCheckout() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    async function placeOrder() {
      const name = document.getElementById('ship-name').value.trim();
      const addr = document.getElementById('ship-address').value.trim();
      const err = document.getElementById('checkout-error');
      const btn = document.getElementById('place-order-btn');

      if (!name || !addr) {
        err.textContent = 'Please fill in all fields.';
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Placing order...';
      err.classList.add('hidden');

      try {
        await apiFetch('/api/cart/checkout', { method: 'POST', body: { address: `${name}\n${addr}` } });
        closeCheckout();
        toast('Order placed! Thank you.');
        await renderCart();
        await updateCartCount();
        setTimeout(() => { window.location.href = '/orders.html'; }, 1500);
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Place Order';
      }
    }

    init();
  </script>
</body>
</html>
